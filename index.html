<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Club KMO — Links</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0a0a;
    --bg-2: #161616;
    --white: #ffffff;
    --ink: #f5f5f5;
    --muted: #8f8f8f;
    --line: rgba(255,255,255,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:var(--bg);
    color:var(--ink);
    font-family:'Space Grotesk', sans-serif;
    display:flex;
    justify-content:center;
    padding:48px 18px 64px;
  }
  .page{ width:100%; max-width:420px; }
  .eyebrow{
    text-align:center;
    letter-spacing:.28em;
    text-transform:uppercase;
    font-size:11px;
    color:var(--muted);
    margin-bottom:10px;
    font-weight:600;
  }
  h1{
    font-family:'Archivo Black', sans-serif;
    text-align:center;
    font-size:clamp(34px, 9vw, 46px);
    line-height:0.95;
    margin:0 0 6px;
    letter-spacing:-0.01em;
    color:#000000;
  }
  .sub{
    text-align:center;
    color:var(--muted);
    font-size:14px;
    margin-bottom:36px;
  }
  ul{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:12px; }
  a.track{
    position:relative;
    display:flex;
    align-items:center;
    gap:14px;
    padding:16px 18px;
    text-decoration:none;
    color:var(--ink);
    background:var(--bg-2);
    border:1px solid var(--line);
    border-radius:14px;
    transition:transform .15s ease, border-color .15s ease, background .15s ease;
    overflow:hidden;
  }
  a.track::before{
    content:"";
    position:absolute; inset:0;
    background:rgba(255,255,255,0.06);
    opacity:0;
    transition:opacity .15s ease;
  }
  a.track:active{ transform:scale(0.98); }
  a.track:hover{ border-color:rgba(255,255,255,0.55); background:#1c1c1c; }
  a.track:hover::before{ opacity:1; }
  .num{
    font-family:'Archivo Black', sans-serif;
    font-size:13px;
    color:var(--muted);
    width:26px;
    flex-shrink:0;
    z-index:1;
  }
  .title{
    font-size:16.5px;
    font-weight:600;
    letter-spacing:.01em;
    z-index:1;
  }
  .arrow{
    margin-left:auto;
    color:var(--muted);
    font-size:18px;
    z-index:1;
    transition:transform .15s ease, color .15s ease;
  }
  a.track:hover .arrow{ transform:translateX(3px); color:var(--white); }
  footer{
    text-align:center;
    margin-top:40px;
    color:var(--muted);
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
  }
</style>
</head>

</html>
